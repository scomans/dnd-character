<div
  class="h-full flex flex-col items-center gap-2 bg-white dark:bg-gray-800 border border-slate-700 dark:border-slate-500 rounded-lg p-2 overflow-hidden"
  pTooltip="Geschicklichkeits-Modifikator"
  tooltipPosition="top"
>
  <span class="text-[0.6rem] font-bold text-gray-600 dark:text-gray-400">
    Rüstungsklasse
  </span>
  <div class="flex flex-col items-center justify-center flex-1">
    @if (editMode.isEditMode()) {
      <p-input-number
        [ngModel]="cs.character().armorValue"
        (ngModelChange)="cs.update({ armorValue: $event ?? 10 })"
        [inputStyle]="{ width: '3rem', textAlign: 'center', fontSize: '1rem', fontWeight: 'bold' }"
      />
    } @else {
      <div class="flex flex-col items-center gap-1">
            <span
              class="text-2xl font-bold text-slate-700 dark:text-slate-300"
              [pTooltip]="getArmorClassTooltip()"
              tooltipPosition="top"
            >{{ cs.getComputedArmorClass() }}</span>
        <label class="flex items-center gap-1 text-xs">
          <p-checkbox
            [ngModel]="cs.character().hasShield"
            (ngModelChange)="cs.update({ hasShield: $event })"
            [binary]="true"
          />
          Schild (+2)
        </label>
      </div>
    }
  </div>

</div>
