<p-confirmDialog/>
<p-fieldset legend="Zähler / Tracker">
  <div class="flex flex-col gap-3">
    @for (counter of cs.character().counters; track $index) {
      <div class="flex flex-wrap items-center gap-2 border border-gray-200 dark:border-gray-700 rounded-lg p-2">
        @if (editMode.isEditMode()) {
          <div class="flex flex-wrap items-center gap-2 flex-1">
            <p-button
              icon="fa"
              [rounded]="true"
              [text]="true"
              severity="danger"
              size="small"
              (onClick)="confirmRemove($index, counter.name)"
              pTooltip="Entfernen"
              tooltipPosition="top"
            >
              <fa-icon [icon]="fasTrash"/>
            </p-button>
            <input
              pInputText
              [ngModel]="counter.name"
              (ngModelChange)="updateCounter($index, { name: $event })"
              placeholder="Name"
              class="text-sm flex-1"
            />
            <p-input-number
              [ngModel]="counter.maxValue"
              (ngModelChange)="updateMaxValue($index, $event ?? 1)"
              [showButtons]="false"
              [min]="1"
              [inputStyle]="{ width: '3rem', textAlign: 'center', fontSize: '0.875rem' }"
              pTooltip="Maximalwert"
              tooltipPosition="top"
            />
          </div>
        } @else {
          <span
            class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex-1"
            [class.line-through]="counter.currentValue <= 0"
          >
            {{ counter.name || 'Unbenannt' }}
          </span>

          <div class="flex items-center gap-1">
            <p-button
              icon="fa"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              size="small"
              (onClick)="decrement($index)"
              [disabled]="counter.currentValue <= 0"
              pTooltip="Verringern"
              tooltipPosition="top"
            >
              <fa-icon [icon]="fasMinus"/>
            </p-button>
            <span class="text-lg font-bold text-slate-700 dark:text-slate-300 text-center">
              <span [class.text-red-500]="counter.currentValue <= 0">{{ counter.currentValue }}</span> / {{ counter.maxValue }}
          </span>
            <p-button
              icon="fa"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              size="small"
              (onClick)="increment($index)"
              [disabled]="counter.currentValue >= counter.maxValue"
              pTooltip="Erhöhen"
              tooltipPosition="top"
            >
              <fa-icon [icon]="fasPlus"/>
            </p-button>
            <p-button
              icon="fa"
              [rounded]="true"
              [text]="true"
              severity="info"
              size="small"
              (onClick)="reset($index)"
              pTooltip="Zurücksetzen"
              tooltipPosition="top"
            >
              <fa-icon [icon]="fasRefresh"/>
            </p-button>
          </div>
        }
      </div>
    }
    @if (editMode.isEditMode()) {
      <p-button
        icon="fa"
        label="Zähler hinzufügen"
        [text]="true"
        size="small"
        (onClick)="add()"
      >
        <fa-icon [icon]="fasPlus"/>
      </p-button>
    }
  </div>
</p-fieldset>
