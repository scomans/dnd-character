<div class="flex gap-2">
  <!-- Ability Scores -->
  @for (ability of abilities; track ability) {
    <div class="flex-1 bg-white dark:bg-gray-800 border border-slate-700 dark:border-slate-500 rounded-lg p-2 flex flex-col items-center">
      <span class="text-[0.6rem] font-bold text-gray-600 dark:text-gray-400">{{ getLabel(ability) }}</span>
      <span class="text-3xl font-bold text-slate-700 dark:text-slate-300">
          {{ cs.getAbilityModifier(ability) >= 0 ? '+' : '' }}{{ cs.getAbilityModifier(ability) }}
        </span>
      <div class="mt-1">
        @if (isEditMode()) {
          <app-number-input
            [ngModel]="getAbilityBase(ability)"
            (ngModelChange)="updateAbility(ability, $event)"
            [min]="1"
            [max]="30"
          />
        } @else {
          <span
            class="text-sm font-medium text-gray-700 dark:text-gray-300 border border-transparent rounded px-2 py-0.5"
          ><p-tag [value]="'' + getAbilityBase(ability)" severity="info"/></span>
        }
      </div>
    </div>
  }
</div>
