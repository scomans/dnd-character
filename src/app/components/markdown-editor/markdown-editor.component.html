@if (editMode.isEditMode() && !readonly()) {
  <div>
    <textarea
      pTextarea
      [autoResize]="true"
      [rows]="minRows()"
      [ngModel]="value()"
      (ngModelChange)="onValueChange($event)"
      class="w-full text-sm"
      [placeholder]="placeholder()"
    ></textarea>
  </div>
} @else {
  <div
    class="relative group min-h-8 p-1 border border-transparent rounded text-sm leading-snug break-words markdown-content"
    [class.text-gray-400]="!value()"
    [class.italic]="!value()"
  >
    @if (value()) {
      <span [innerHTML]="renderedHtml()"></span>
    } @else if (!readonly()) {
      <span
        class="text-gray-400 dark:text-gray-500 italic text-xs"
      >{{ placeholder() }}</span>
    }
  </div>
}
