<div class="bg-white dark:bg-gray-800 border-2 border-slate-700 dark:border-slate-500 rounded-lg p-2 mb-2">
  <div class="flex items-center gap-4">
    <!-- Character Image (larger) -->
    @if (cs.character().characterImage) {
      <div class="shrink-0 flex items-center">
        <p-image
          [src]="cs.character().characterImage"
          alt="Charakter"
          [preview]="true"
          width="96"
          imageClass="w-20 h-20 object-cover rounded-lg border border-gray-300 dark:border-gray-600"
        />
      </div>
    }
    <!-- Character Name + Class -->
    <div class="flex-1 min-w-0">
      @if (editingName()) {
        <input
          pInputText
          [ngModel]="cs.character().characterName"
          (ngModelChange)="cs.update({ characterName: $event })"
          placeholder="Charaktername"
          class="text-2xl font-bold tracking-wide w-full"
          (clickOutside)="editingName.set(false)"
          autofocus
        />
      } @else {
        <span
          class="text-2xl font-bold text-slate-800 dark:text-slate-200 tracking-wide cursor-pointer hover:text-slate-500 block"
          (click)="editingName.set(true)"
          pTooltip="Klicken zum Bearbeiten"
          tooltipPosition="top"
        >{{ cs.character().characterName || 'Charaktername' }}</span>
      }
      @if (cs.character().className) {
        <span class="text-sm text-slate-500 dark:text-slate-400">{{ cs.character().className }} - Stufe {{ cs.character().level }}</span>
      }
    </div>
    <!-- Stufe & EP on the right -->
    <div class="shrink-0 flex gap-2 items-end">
      <p-ifta-label>
        <p-input-number
          [ngModel]="cs.character().level"
          (ngModelChange)="cs.update({ level: $event ?? 1 })"
          [min]="1"
          [max]="20"
          [showButtons]="false"
          [inputStyle]="{ width: '4rem', fontSize: '0.85rem' }"
          inputId="header-level"
        />
        <label for="header-level">Stufe</label>
      </p-ifta-label>
      <p-ifta-label>
        <p-input-number
          [ngModel]="cs.character().experiencePoints"
          (ngModelChange)="cs.update({ experiencePoints: $event ?? 0 })"
          [useGrouping]="false"
          [inputStyle]="{ width: '5rem', fontSize: '0.85rem' }"
          inputId="header-xp"
        />
        <label for="header-xp">EP</label>
      </p-ifta-label>
    </div>
  </div>
</div>
