<p-fieldset class="relative">
  <ng-template #header>
    <div class="flex items-center gap-2 w-full">
      <span class="font-bold">Übung und Sprachen</span>
      <p-button
        icon="fa"
        [rounded]="true"
        [text]="true"
        size="small"
        (onClick)="editing.set(!editing())"
        [pTooltip]="editing() ? 'Bearbeitung beenden' : 'Bearbeiten'"
        tooltipPosition="top"
      >
        <fa-icon [icon]="editing() ? fasCheck : fasPencil" />
      </p-button>
    </div>
  </ng-template>
  <div class="space-y-3">
    <!-- Armor Proficiencies -->
    <div>
      <span class="text-[0.65rem] font-bold text-gray-600 dark:text-gray-400">Rüstung</span>
      <div class="flex flex-wrap gap-3 mt-1">
        <label class="flex items-center gap-1 text-xs">
          <p-checkbox
            [ngModel]="cs.character().armorProficiencies.light" (ngModelChange)="updateArmor('light', $event)" [binary]="true" [disabled]="!editing()"
          />
          Leichte
        </label>
        <label class="flex items-center gap-1 text-xs">
          <p-checkbox
            [ngModel]="cs.character().armorProficiencies.medium" (ngModelChange)="updateArmor('medium', $event)" [binary]="true"
            [disabled]="!editing()"
          />
          Mittlere
        </label>
        <label class="flex items-center gap-1 text-xs">
          <p-checkbox
            [ngModel]="cs.character().armorProficiencies.heavy" (ngModelChange)="updateArmor('heavy', $event)" [binary]="true" [disabled]="!editing()"
          />
          Schwere
        </label>
        <label class="flex items-center gap-1 text-xs">
          <p-checkbox
            [ngModel]="cs.character().armorProficiencies.shields" (ngModelChange)="updateArmor('shields', $event)" [binary]="true"
            [disabled]="!editing()"
          />
          Schilde
        </label>
      </div>
    </div>

    <!-- Weapon Proficiencies -->
    <div>
      <span class="text-[0.65rem] font-bold text-gray-600 dark:text-gray-400">Waffen</span>
      <div class="flex flex-wrap gap-3 mt-1">
        <label class="flex items-center gap-1 text-xs">
          <p-checkbox
            [ngModel]="cs.character().weaponProficiencies.simple" (ngModelChange)="updateWeapon('simple', $event)" [binary]="true"
            [disabled]="!editing()"
          />
          Einfache
        </label>
        <label class="flex items-center gap-1 text-xs">
          <p-checkbox
            [ngModel]="cs.character().weaponProficiencies.martial" (ngModelChange)="updateWeapon('martial', $event)" [binary]="true"
            [disabled]="!editing()"
          />
          Kriegswaffen
        </label>
      </div>
      @if (editing()) {
        <div class="mt-1 flex items-center gap-1 text-xs">
          <span>Sonstige Waffen:</span>
          <input pInputText [ngModel]="cs.character().weaponProficiencies.other" (ngModelChange)="updateWeaponOther($event)" class="flex-1 text-xs" />
        </div>
      } @else if (cs.character().weaponProficiencies.other) {
        <div class="mt-1 text-xs text-gray-600 dark:text-gray-400">Sonstige: {{ cs.character().weaponProficiencies.other }}</div>
      }
    </div>

    <!-- Languages -->
    <div>
      <span class="text-[0.65rem] font-bold text-gray-600 dark:text-gray-400">Sprachen</span>
      <app-markdown-editor
        [value]="cs.character().languages"
        (valueChange)="cs.update({ languages: $event })"
        placeholder="Sprachen..."
        [minRows]="2"
      />
    </div>

    <!-- Tools & Other -->
    <div>
      <span class="text-[0.65rem] font-bold text-gray-600 dark:text-gray-400">Werkzeuge & Andere</span>
      <app-markdown-editor
        [value]="cs.character().toolsAndOther"
        (valueChange)="cs.update({ toolsAndOther: $event })"
        placeholder="Werkzeuge..."
        [minRows]="2"
      />
    </div>
  </div>
</p-fieldset>
