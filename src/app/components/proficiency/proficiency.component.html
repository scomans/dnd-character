<!-- Proficiency Bonus -->
<div
  class="h-full flex flex-col items-center gap-2 bg-white dark:bg-gray-800 border border-slate-700 dark:border-slate-500 rounded-lg p-2 overflow-hidden"
  pTooltip="Übungsbonus"
  tooltipPosition="right"
>
    <span class="text-[0.6rem] font-bold text-gray-600 dark:text-gray-400">
      Übungsbonus
    </span>
  <div class="flex flex-col items-center justify-center flex-1">
    @if (isEditMode()) {
      <app-number-input
        [ngModel]="cs.character().proficiencyBonusOverride ?? cs.getProficiencyBonus()"
        (ngModelChange)="updateProficiency($event)"
        [min]="1"
        [max]="6"
      />
    } @else {
      <span class="text-2xl font-bold text-slate-700 dark:text-slate-300">
        +{{ cs.getProficiencyBonus() }}
      </span>
    }
  </div>
</div>
