<p-confirmDialog />

<!-- Tree content shared between desktop sidebar and mobile drawer -->
<ng-template #treeContent>
  <div class="flex items-center justify-between px-3 py-2 border-b border-slate-200 dark:border-gray-600 bg-slate-50 dark:bg-gray-700">
    <span class="text-xs font-bold text-gray-600 dark:text-gray-400 uppercase tracking-wide">Notizen</span>
    <div class="flex gap-1">
      <p-button
        icon="pi pi-plus"
        [rounded]="true"
        [text]="true"
        size="small"
        (onClick)="addRootNote()"
        pTooltip="Neue Notiz"
        tooltipPosition="top"
      />
    </div>
  </div>
  <div class="flex-1 overflow-y-auto p-1">
    @if (treeNodes().length) {
      <p-tree
        [value]="treeNodes()"
        selectionMode="single"
        [(selection)]="selectedTreeNode"
        (selectionChange)="onNodeSelect($event)"
        (onNodeExpand)="onNodeToggle()"
        (onNodeCollapse)="onNodeToggle()"
        [contextMenu]="cm"
        [metaKeySelection]="false"
        class="notes-tree"
      >
        <ng-template #nodeTemplate let-node>
          <div class="flex items-center gap-1 w-full">
            <span class="flex-1 truncate text-sm">{{ node.label }}</span>
            <button
              type="button"
              class="pi pi-plus text-xs text-gray-400 hover:text-blue-500 dark:text-gray-500 dark:hover:text-blue-400 bg-transparent border-none cursor-pointer p-0.5 rounded hover:bg-slate-200 dark:hover:bg-gray-600"
              (click)="addChildNoteById(node.key); $event.stopPropagation()"
              title="Unternotiz hinzufügen"
            ></button>
          </div>
        </ng-template>
      </p-tree>
    } @else {
      <div class="flex flex-col items-center justify-center h-full text-gray-400 dark:text-gray-500 text-sm p-4 text-center">
        <i class="pi pi-file-edit text-3xl mb-2"></i>
        <span>Noch keine Notizen.</span>
        <button
          type="button"
          class="mt-2 text-blue-500 hover:text-blue-700 dark:text-blue-400 text-xs cursor-pointer bg-transparent border-none"
          (click)="addRootNote()"
        >Erste Notiz erstellen</button>
      </div>
    }
  </div>
</ng-template>

<!-- Mobile Drawer (visible on small/medium screens) -->
<p-drawer
  [(visible)]="sidebarVisible"
  header="Notizen"
  [style]="{ width: '280px' }"
  [closable]="true"
>
  <ng-container *ngTemplateOutlet="treeContent" />
</p-drawer>

<div class="flex gap-4 mt-4" style="min-height: 500px;">
  <!-- Left: Tree View (hidden on small/medium screens) -->
  <div
    class="hidden md:flex flex-col border border-slate-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 overflow-hidden"
    style="width: 280px; min-width: 220px;"
  >
    <ng-container *ngTemplateOutlet="treeContent" />
  </div>

  <!-- Right: Editor -->
  <div class="flex-1 flex flex-col border border-slate-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 overflow-hidden">
    @if (selectedNote()) {
      <!-- Note title bar -->
      <div class="flex items-center gap-2 px-3 py-2 border-b border-slate-200 dark:border-gray-600 bg-slate-50 dark:bg-gray-700">
        <!-- Toggle sidebar button (visible only on small/medium screens) -->
        <p-button
          icon="pi pi-bars"
          [rounded]="true"
          [text]="true"
          size="small"
          (onClick)="sidebarVisible.set(true)"
          pTooltip="Notizen-Liste"
          tooltipPosition="top"
          class="md:hidden"
        />
        @if (renamingNote()) {
          <input
            pInputText
            [(ngModel)]="renameValue"
            (keydown.enter)="confirmRename()"
            (keydown.escape)="cancelRename()"
            (blur)="confirmRename()"
            class="text-sm flex-1"
            autofocus
          />
        } @else {
          <span
            class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex-1 cursor-pointer hover:text-blue-600"
            (dblclick)="startRename()"
            pTooltip="Doppelklick zum Umbenennen"
            tooltipPosition="top"
          >{{ selectedNote()!.label }}</span>
        }
        <div class="flex gap-1">
          <p-button
            icon="pi pi-plus"
            [rounded]="true"
            [text]="true"
            size="small"
            (onClick)="addChildNote()"
            pTooltip="Unternotiz hinzufügen"
            tooltipPosition="top"
          />
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            size="small"
            (onClick)="startRename()"
            pTooltip="Umbenennen"
            tooltipPosition="top"
          />
          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            size="small"
            (onClick)="confirmDeleteSelectedNote()"
            pTooltip="Löschen"
            tooltipPosition="top"
          />
        </div>
      </div>
      <!-- Editor area -->
      <div class="flex-1 flex flex-col overflow-hidden">
        @if (editingContent()) {
          <textarea
            pTextarea
            [autoResize]="false"
            [ngModel]="selectedNote()!.content"
            (ngModelChange)="updateNoteContent($event)"
            class="w-full flex-1 text-sm border-none resize-none p-3 bg-white dark:bg-gray-800 dark:text-gray-200"
            style="min-height: 100%; outline: none;"
            placeholder="Markdown-Inhalt hier eingeben..."
          ></textarea>
          <div class="flex justify-end px-3 py-1 border-t border-slate-200 dark:border-gray-600 bg-slate-50 dark:bg-gray-700">
            <p-button
              label="Vorschau"
              icon="pi pi-eye"
              [text]="true"
              size="small"
              (onClick)="editingContent.set(false)"
            />
          </div>
        } @else {
          <div
            class="flex-1 overflow-y-auto p-3 text-sm leading-relaxed markdown-content"
            [innerHTML]="renderedHtml()"
          ></div>
          <div class="flex justify-end px-3 py-1 border-t border-slate-200 dark:border-gray-600 bg-slate-50 dark:bg-gray-700">
            <p-button
              label="Bearbeiten"
              icon="pi pi-pencil"
              [text]="true"
              size="small"
              (onClick)="editingContent.set(true)"
            />
          </div>
        }
      </div>
    } @else {
      <div class="flex flex-col items-center justify-center h-full text-gray-400 dark:text-gray-500">
        <i class="pi pi-file-edit text-5xl mb-3"></i>
        <span class="text-sm">Wähle eine Notiz aus oder erstelle eine neue.</span>
        <!-- Open sidebar button on small screens when no note is selected -->
        <p-button
          label="Notizen-Liste öffnen"
          icon="pi pi-bars"
          [text]="true"
          size="small"
          (onClick)="sidebarVisible.set(true)"
          class="mt-3 md:hidden"
        />
      </div>
    }
  </div>
</div>

<p-context-menu #cm [model]="contextMenuItems" />
