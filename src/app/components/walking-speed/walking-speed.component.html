<!-- Speed -->
<div
  class="h-full flex flex-col items-center gap-2 bg-white dark:bg-gray-800 border border-slate-700 dark:border-slate-500 rounded-lg p-2 overflow-hidden"
>
  <span class="text-[0.6rem] font-bold text-gray-600 dark:text-gray-400">
    Bewegungsrate
  </span>
  <div class="flex flex-col items-center justify-center flex-1">
    @if (editMode.isEditMode()) {
      <p-input-group class="justify-center">
        <p-input-number
          [ngModel]="cs.character().speed"
          (ngModelChange)="cs.update({ speed: $event ?? 30 })"
          [inputStyle]="{ width: '3rem', textAlign: 'center', fontSize: '1.5rem', fontWeight: 'bold' }"
          suffix=" m"
        />
      </p-input-group>
    } @else {
      <span
        class="text-2xl font-bold text-slate-700 dark:text-slate-300"
      >{{ cs.character().speed }} m</span>
    }
  </div>
</div>
